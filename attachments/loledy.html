<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Wiki de Vozes dos Campeões</title>
    <!-- Fontes do Google Fonts (Cinzel / Spiegel) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Spiegel:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #06080c;
            --bg-card: #0d1017;
            --accent-gold: #c8aa6e;
            --accent-gold-bright: #f0e6d2;
            --accent-gold-glow: #e2be72;
            --border-color: #1a1e26;
            --border-gold: #785a28;
            --text-main: #a09b8c;
            --text-bright: #f0e6d2;
            --text-muted: #5b5a56;
            --lol-blue: #0ac8b9;

            --font-gill: 'Gill Sans', 'Gill Sans MT', 'Cinzel', sans-serif;
            --font-spiegel: 'Spiegel', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-dark);
        }

        body {
            font-family: var(--font-spiegel);
            background-color: transparent;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 130px;
            position: relative;
        }

        /* CONTROLE RIGOROSO DE VISIBILIDADE DO MODO EDIÇÃO */
        .edit-only, .edit-only-inline {
            display: none !important;
        }

        body.edit-mode .edit-only {
            display: flex !important;
        }

        body.edit-mode .edit-only-inline {
            display: inline-flex !important;
        }

        /* FIX DEFINITIVO PARA O FUNDO FIXO EM DISPOSITIVOS MOBILES */
        #fixedBgLayer {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh; /* Garante ajuste perfeito às barras de navegação mobile */
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            z-index: -2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            will-change: transform, opacity;
            transform: translateZ(0); /* Força aceleração por hardware */
        }

        #fixedBgOverlay {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            background:
                radial-gradient(circle at 50% 30%, rgba(6, 8, 12, 0.35) 0%, rgba(6, 8, 12, 0.75) 60%, #06080c 100%),
                linear-gradient(to bottom, rgba(6, 8, 12, 0.4) 0%, rgba(6, 8, 12, 0.9) 80%, #06080c 100%);
            z-index: -1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            will-change: opacity;
            transform: translateZ(0);
        }

        /* Cabeçalho Fixo Permanente */
        header {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(6, 8, 12, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            will-change: transform;
            transform: translateZ(0);
        }

        main {
            padding-top: 10px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .header-title h1 {
            font-family: var(--font-gill);
            font-size: 0.95rem;
            color: var(--accent-gold-bright);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            font-weight: 700;
        }

        /* BOTÃO MODO LEITURA / EDIÇÃO */
        .toggle-mode-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-gold);
            color: var(--accent-gold-bright);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            font-family: var(--font-gill);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toggle-mode-btn.editing {
            background: linear-gradient(135deg, var(--accent-gold), #785a28);
            color: #000;
            font-weight: bold;
        }

        /* BARRA DE ATALHOS SOMENTE NO MODO EDIÇÃO */
        .icon-toolbar {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .icon-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-gold);
            color: var(--accent-gold-bright);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.1s;
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .search-box input {
            width: 100%;
            padding: 6px 12px;
            background: #0f131a;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-bright);
            font-size: 0.8rem;
            outline: none;
            user-select: text;
            font-family: var(--font-spiegel);
        }

        .btn {
            background: linear-gradient(135deg, #181d26, #0b0e14);
            border: 1px solid var(--border-gold);
            color: var(--accent-gold-bright);
            padding: 4px 8px;
            border-radius: 0px;
            font-size: 0.68rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-family: var(--font-gill);
        }

        .champions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            padding: 14px;
            max-width: 900px;
            margin: 0 auto;
        }

        .champ-card {
            position: relative;
            aspect-ratio: 0.6;
            border-radius: 0px;
            overflow: hidden;
            border: 1px solid var(--border-gold);
            background-color: var(--bg-card);
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .champ-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-gold-bright);
        }

        .champ-card-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .champ-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.1) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 6px;
            text-align: center;
            z-index: 1;
        }

        .champ-card-name {
            font-family: var(--font-gill);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-bright);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            line-height: 1;
        }

        .champ-card-title {
            font-family: var(--font-gill);
            font-size: 0.65rem;
            color: var(--accent-gold);
            margin-top: 3px;
            line-height: 1.1;
            font-style: italic;
            text-transform: none;
        }

        .champ-edit-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--accent-gold);
            padding: 2px 4px;
            font-size: 0.62rem;
            color: var(--accent-gold-bright);
            z-index: 10;
            font-family: var(--font-gill);
        }

        .champion-view { max-width: 900px; margin: 0 auto; }

        .hero-banner {
            position: relative;
            padding: 20px 16px 16px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(120, 90, 40, 0.4);
            overflow: hidden;
        }

        .inline-back-btn {
            position: absolute;
            top: 10px;
            left: 12px;
            z-index: 10;
            background: rgba(6, 8, 12, 0.65);
            border: 1px solid var(--border-gold);
            color: var(--accent-gold-bright);
            padding: 4px 10px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(4px);
            font-family: var(--font-gill);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-icon-frame {
            position: relative;
            width: 120px;
            height: 220px;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 15px rgba(200, 170, 110, 0.3);
            margin-top: 10px;
            margin-bottom: 10px;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            transition: background-image 0.3s ease-in-out, opacity 0.3s ease-in-out;
            overflow: hidden;
        }

        .hero-frame-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease-in-out;
        }

        .hero-name {
            font-family: var(--font-gill);
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-gold-bright);
            text-transform: uppercase;
            letter-spacing: 3px;
            line-height: 1;
        }

        .hero-subtitle {
            font-family: var(--font-gill);
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-style: italic;
            margin-top: 4px;
            margin-bottom: 10px;
            text-transform: none;
        }

        .hero-tags { display: flex; gap: 6px; margin-bottom: 12px; }

        .tag-badge {
            background: rgba(200, 170, 110, 0.15);
            border: 1px solid var(--border-gold);
            color: var(--accent-gold);
            font-size: 0.6rem;
            font-weight: bold;
            padding: 2px 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-family: var(--font-gill);
        }

        .hero-bio {
            font-family: var(--font-spiegel);
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--text-bright);
            text-align: center;
            max-height: 64px;
            overflow: hidden;
            transition: max-height 0.4s ease;
            user-select: text;
            font-weight: 400;
        }

        .hero-bio.expanded { max-height: 1000px; }

        .read-more-btn {
            background: none;
            border: none;
            color: var(--accent-gold);
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 6px;
            font-family: var(--font-gill);
        }

        /* NAVEGAÇÃO DE SKINS */
        .skins-section {
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
            display: block !important;
            visibility: visible !important;
        }

        .section-label {
            font-family: var(--font-gill);
            font-size: 0.75rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }

        .skins-carousel {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            align-items: flex-start;
        }

        .skin-item {
            flex: 0 0 80px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .skin-thumb {
            width: 80px;
            height: 80px;
            border: 1px solid var(--border-gold);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin-bottom: 4px;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
            transition: border-color 0.2s, transform 0.2s ease;
            overflow: hidden;
        }

        .skin-item:hover .skin-thumb { border-color: var(--accent-gold); transform: scale(1.03); }

        .skin-item.active .skin-thumb {
            border: 2px solid var(--accent-gold-bright);
            box-shadow: 0 0 10px rgba(240, 230, 210, 0.5);
        }

        .skin-name { font-family: var(--font-gill); font-size: 0.65rem; color: var(--text-main); line-height: 1.2; }
        .skin-item.active .skin-name { color: var(--accent-gold-bright); font-weight: bold; }

        .add-skin-card {
            flex: 0 0 80px;
            height: 80px;
            border: 1px dashed var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-size: 1.5rem;
            cursor: pointer;
            background: rgba(200, 170, 110, 0.05);
        }

        /* ÁREA DE CONTEÚDO E FALA */
        .content-area {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 16px 20px 16px;
            display: block !important;
            visibility: visible !important;
        }

        .dynamic-header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1.5rem;
            margin-bottom: 0.6rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .dynamic-header-content h1,
        .dynamic-header-content h2,
        .dynamic-header-content h3,
        .dynamic-header-content h4 {
            font-family: var(--font-gill);
        }

        .dynamic-header-content h1 { font-size: 1.1rem; color: var(--accent-gold-bright); text-transform: uppercase; }
        .dynamic-header-content h2 { font-size: 0.95rem; color: #ffffff; text-transform: uppercase; }
        .dynamic-header-content h3 { font-size: 0.85rem; color: var(--text-bright); }
        .dynamic-header-content h4 { font-size: 0.78rem; color: var(--accent-gold); }

        .item-actions { gap: 4px; align-items: center; margin-left: 6px; }
        .action-btn-add {
            cursor: pointer; font-size: 0.68rem; padding: 2px 6px;
            background: linear-gradient(135deg, var(--accent-gold), #785a28); color: #000;
            font-weight: bold; font-family: var(--font-gill);
        }
        .action-icon { cursor: pointer; font-size: 0.68rem; padding: 2px 5px; background: rgba(255, 255, 255, 0.1); }

        .quote-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
            padding: 6px 8px 6px 12px;
            position: relative;
            border-radius: 0px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .quote-content-text b,
        .quote-content-text strong,
        .dynamic-header-content b,
        .dynamic-header-content strong {
            font-weight: 900 !important;
            color: #ffffff !important;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.6);
            letter-spacing: 0.3px;
        }

        .quote-row.is-playing {
            background: linear-gradient(90deg,
                rgba(226, 190, 114, 0.38) 0%,
                rgba(200, 170, 110, 0.18) 35%,
                rgba(200, 170, 110, 0.05) 75%,
                rgba(6, 8, 12, 0.0) 100%);
            border: none;
            border-left: 3px solid var(--accent-gold-glow);
            position: relative;
        }

        .quote-row.is-playing::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, rgba(226, 190, 114, 0.9) 0%, rgba(226, 190, 114, 0.4) 40%, rgba(0,0,0,0) 100%);
        }

        .quote-row.is-playing::after {
            content: "";
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, rgba(226, 190, 114, 0.9) 0%, rgba(226, 190, 114, 0.4) 40%, rgba(0,0,0,0) 100%);
        }

        .quote-bullet {
            position: absolute;
            left: 2px;
            top: 10px;
            width: 4px;
            height: 4px;
            background-color: var(--accent-gold);
            border-radius: 50%;
        }

        .quote-content-text {
            font-family: var(--font-spiegel);
            font-size: 0.85rem;
            color: var(--text-bright);
            line-height: 1.4;
            flex: 1;
            font-style: italic;
            user-select: text;
        }

        .inline-icon, img {
            width: auto;
            max-width: 24px;
            height: auto;
            max-height: 24px;
            vertical-align: middle;
            object-fit: contain;
            display: inline-block;
            margin: 0 3px;
        }

        .fandom-audio-btn {
            width: 20px;
            height: 20px;
            background: rgba(200, 170, 110, 0.15);
            border: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--accent-gold);
            flex-shrink: 0;
            margin-top: 2px;
            z-index: 2;
        }

        .fandom-audio-btn.play-icon::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 3px 0 3px 5px;
            border-color: transparent transparent transparent var(--accent-gold);
            margin-left: 1px;
        }

        .fandom-audio-btn.pause-icon {
            background: var(--accent-gold);
        }

        .fandom-audio-btn.pause-icon::after {
            content: "";
            display: block;
            width: 5px;
            height: 7px;
            border-left: 2px solid #000;
            border-right: 2px solid #000;
        }

        .lol-sounds-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #03060a;
            border-top: 1px solid var(--border-gold);
            padding: 10px 14px;
            z-index: 1000;
            will-change: transform;
            transform: translateZ(0);
        }

        .player-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-upper-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .player-info-box {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .eq-icon-frame {
            width: 38px;
            height: 38px;
            border: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background-color: var(--bg-card);
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        .eq-icon-frame svg { width: 16px; height: 16px; fill: var(--accent-gold); }

        .player-title-text {
            font-family: var(--font-gill);
            font-size: 0.78rem;
            color: var(--accent-gold-bright);
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
        }

        .nav-btn svg { width: 11px; height: 11px; fill: var(--accent-gold); }

        .play-square-btn {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #093c42, #041f23);
            border: 1px solid var(--lol-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .play-square-btn svg { width: 12px; height: 12px; fill: var(--lol-blue); }

        .dl-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            opacity: 0.8;
        }

        .dl-btn svg { width: 14px; height: 14px; fill: var(--accent-gold); }

        .player-progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-time {
            font-family: var(--font-gill);
            font-size: 0.7rem;
            color: var(--accent-gold);
            min-width: 30px;
        }

        .player-progress-bar {
            flex: 1;
            height: 2px;
            background: #201a12;
            appearance: none;
            outline: none;
            cursor: pointer;
        }

        .player-progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 7px;
            height: 7px;
            background: var(--accent-gold);
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }

        .modal-content {
            background: #0b0e14;
            border: 1px solid var(--border-gold);
            width: 100%;
            max-width: 500px;
            padding: 16px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            font-family: var(--font-gill);
        }

        .close-modal { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.7rem; color: var(--accent-gold); margin-bottom: 3px; font-weight: bold; font-family: var(--font-gill); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; background: #05070a; border: 1px solid var(--border-color);
            padding: 6px; color: var(--text-bright); font-size: 0.8rem; outline: none; user-select: text;
            font-family: var(--font-spiegel);
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            background: #05070a;
        }

        .rich-editor {
            width: 100%;
            min-height: 80px;
            padding: 8px;
            color: var(--text-bright);
            font-size: 0.82rem;
            outline: none;
            user-select: text;
            font-family: var(--font-spiegel);
        }

        .editor-toolbar-bottom {
            display: flex;
            gap: 4px;
            background: #11151f;
            padding: 4px 6px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            align-items: center;
        }

        .tb-btn {
            background: #05070a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 3px 8px;
            font-size: 0.72rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-family: var(--font-gill);
        }

        .tb-btn.active {
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold-bright);
            background: rgba(200, 170, 110, 0.15);
        }

        .audio-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .audio-input-row input { flex: 1; margin-bottom: 0 !important; }

        .remove-audio-btn {
            background: rgba(230, 57, 86, 0.2);
            border: 1px solid #e63956;
            color: #e63956;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .skin-editor-card {
            background: #05070a;
            border: 1px solid var(--border-color);
            padding: 10px;
            margin-bottom: 10px;
        }

        .skin-field-block {
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(200, 170, 110, 0.2);
            padding-bottom: 6px;
        }

        .skin-field-block label {
            font-size: 0.68rem;
            color: var(--accent-gold);
            display: block;
            margin-bottom: 2px;
            font-family: var(--font-gill);
        }

        .pos-controls-row { display: flex; gap: 6px; margin-top: 3px; }
        .pos-controls-row label { font-size: 0.65rem; color: var(--text-main); font-family: var(--font-gill); }

        .modal-btn {
            width: 100%; padding: 8px; background: linear-gradient(135deg, var(--accent-gold), #785a28);
            border: none; color: #000; font-weight: bold; font-size: 0.8rem; cursor: pointer; margin-top: 8px;
            text-transform: uppercase; font-family: var(--font-gill);
        }

        .delete-btn { background: rgba(230, 57, 86, 0.2); border: 1px solid #e63956; color: #e63956; }
        .empty-msg { text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.82rem; font-family: var(--font-gill); }
    </style>
</head>
<body>

    <div id="fixedBgOverlay"></div>

            <button class="icon-btn" title="Importar JSON" onclick="document.getElementById('jsonFileInput').click()">📤</button>
            <button class="icon-btn" title="Importar Falas (.txt)" onclick="openTextImportModal()">📄</button>
            <button class="icon-btn" title="Editar Imagens / Splash" onclick="openQuickMediaModal()">🖼️</button>
            <button class="icon-btn" title="Nova Categoria" onclick="openTitleModal()">📁</button>

                <div class="player-info-box">

                    </div>
                    <div class="player-title-text" id="playerTrackTitle">NADA SELECIONADO</div>

                <div class="player-controls-group">

        <div class="modal-content">
            <div class="modal-header">

Movimentação

    <div class="modal-overlay" id="transferModal" style="display: none;">

            <div class="form-group">

                    <option value="start">No Início</option>

                <label>Texto da Categoria</label>
                <div class="editor-container">
                    <div class="rich-editor" id="titleEditor" contenteditable="true"></div>
                    <div class="editor-toolbar-bottom">
                        <button class="tb-btn" onmousedown="event.preventDefault();" onclick="applyFormat('bold', 'titleEditor', this)"><b>B</b></button>

                        <button class="tb-btn" onmousedown="event.preventDefault();" onclick="applyFormat('italic', 'quoteTextEditor', this)"><i>I</i></button>
                        <label class="tb-btn">
                            🖼️ +Arquivo
                            <input type="file" accept="image/*" style="display:none;" onchange="insertImageFromFile('quoteTextEditor', event)">
                        </label>

    <input type="file" id="jsonFileInput" accept=".json" style="display: none;" onchange="importarBackupJSON(event)">

    <audio id="globalAudioPlayer"></audio>

    <script>
        let db;
        let champions = [];
        let pageElements = [];
        let currentChampId = null;
        let selectedSkinIndex = 0;
        let currentAudioList = [];
        let currentAudioIndex = -1;
        let videoObserver = null;
        let isEditMode = false;

        const globalPlayer = document.getElementById("globalAudioPlayer");

        const request = indexedDB.open("WikiVozesDB", 21);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("champions")) {
                db.createObjectStore("champions", { keyPath: "id", autoIncrement: true });
            }
            if (!db.objectStoreNames.contains("elements")) {
                const eStore = db.createObjectStore("elements", { keyPath: "id", autoIncrement: true });
                eStore.createIndex("champId", "champId", { unique: false });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            initVideoObserver();
            loadData();
            setupPlayerListeners();
        };

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById("toggleModeBtn");
            const icon = document.getElementById("modeIcon");
            const text = document.getElementById("modeText");

            if (isEditMode) {
                document.body.classList.add("edit-mode");
                btn.classList.add("editing");
                icon.innerText = "✏️";
                text.innerText = "Modo Edição";
            } else {
                document.body.classList.remove("edit-mode");
                btn.classList.remove("editing");
                icon.innerText = "👁️";
                text.innerText = "Modo Leitura";
            }
        }

        function isMediaVideo(url) {
            if (!url) return false;
            if (url.startsWith("data:video")) return true;
            const cleanUrl = url.split('?')[0].split('#')[0];
            return /\.(mp4|webm|ogg|mov)$/i.test(cleanUrl);
        }

        function initVideoObserver() {
            if ('IntersectionObserver' in window) {
                videoObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const video = entry.target;
                        if (entry.isIntersecting) {
                            video.play().catch(() => {});
                        } else {
                            video.pause();
                        }
                    });
                }, { threshold: 0.1 });
            }
        }

        function observeVideos() {
            if (!videoObserver) return;
            document.querySelectorAll("video.lazy-video").forEach(v => videoObserver.observe(v));
        }

        function loadData(callback) {
            const tx = db.transaction(["champions", "elements"], "readonly");
            tx.objectStore("champions").getAll().onsuccess = function(e) { champions = e.target.result; };
            tx.objectStore("elements").getAll().onsuccess = function(e) {
                pageElements = e.target.result;
                if (callback) {
                    callback();
                } else {
                    if (currentChampId !== null) showChampionPage(currentChampId);
                    else showChampionsList();
                }
            };
        }

        function handleSearch() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            if (currentChampId === null) {
                const cards = document.querySelectorAll(".champ-card");
                cards.forEach(card => {
                    const name = card.querySelector(".champ-card-name").innerText.toLowerCase();
                    const title = card.querySelector(".champ-card-title").innerText.toLowerCase();
                    if (name.includes(query) || title.includes(query)) {
                        card.style.display = "block";
                    } else {
                        card.style.display = "none";
                    }
                });
            } else {
                const rows = document.querySelectorAll(".quote-row");
                rows.forEach(row => {
                    const text = row.querySelector(".quote-content-text").innerText.toLowerCase();
                    if (text.includes(query)) {
                        row.style.display = "flex";
                    } else {
                        row.style.display = "none";
                    }
                });
            }
        }

        function updatePlayerMiniature() {
            const frame = document.getElementById("playerChampThumbFrame");
            if (!frame) return;

            const champ = champions.find(c => c.id === currentChampId);
            if (champ && champ.skins && champ.skins[selectedSkinIndex]) {
                const s = champ.skins[selectedSkinIndex];
                const thumbUrl = s.thumb || champ.imgUrl || "";
                if (thumbUrl) {
                    frame.style.backgroundImage = `url('${thumbUrl}')`;
                    frame.innerHTML = "";
                    return;
                }
            }
            frame.style.backgroundImage = "none";
            frame.innerHTML = `<svg viewBox="0 0 24 24"><path d="M7 18h2V6H7v12zm4 4h2V2h-2v20zm-8-8h2v-4H3v4zm16-8v12h2V10h-2zm-4 8h2v-8h-2v8z"/></svg>`;
        }

        function showChampionsList() {
            currentChampId = null;

            const fixedBg = document.getElementById("fixedBgLayer");
            const fixedOverlay = document.getElementById("fixedBgOverlay");
            fixedBg.style.opacity = '0';
            fixedOverlay.style.opacity = '0';

            document.getElementById("addChampIconBtn").style.display = "inline-flex";

            const main = document.getElementById("mainContainer");
            if (champions.length === 0) {
                main.innerHTML = `<div class="empty-msg">Nenhum campeão cadastrado. Alterne para o <b>Modo Edição</b> e clique no ícone <b>➕</b> ou no ícone 📤 de importar JSON.</div>`;
                return;
            }

            const sortedChampions = [...champions].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));

            let html = '<div class="champions-grid">';
            sortedChampions.forEach(c => {
                const bgImg = (c.skins && c.skins[0] && c.skins[0].frameImg) ? c.skins[0].frameImg : (c.imgUrl || '');
                const editBadge = `<div class="champ-edit-badge edit-only" onclick="event.stopPropagation(); openChampModal(${c.id})">⚙️ Editar</div>`;

                const hasVideo = isMediaVideo(bgImg);
                const mediaBg = hasVideo
                    ? `<video class="champ-card-video lazy-video" src="${bgImg}" loop muted playsinline></video>`
                    : '';
                const styleBg = hasVideo ? '' : `style="background-image: url('${bgImg}')"`;

                html += `
                    <div class="champ-card" ${styleBg} onclick="showChampionPage(${c.id})">
                        ${mediaBg}
                        ${editBadge}
                        <div class="champ-card-overlay">
                            <div class="champ-card-name">${c.name}</div>
                            <div class="champ-card-title">${c.title || ''}</div>
                        </div>
                    </div>`;
            });
            html += '</div>';
            main.innerHTML = html;
            observeVideos();
            updatePlayerMiniature();
        }

        function updateBackgroundSplash(imageUrl) {
            const fixedBg = document.getElementById("fixedBgLayer");
            const fixedOverlay = document.getElementById("fixedBgOverlay");

            if (!imageUrl) {
                fixedBg.style.opacity = '0';
                fixedOverlay.style.opacity = '0';
                return;
            }

            const tempImg = new Image();
            tempImg.src = imageUrl;
            tempImg.onload = () => {
                fixedBg.style.backgroundImage = `url('${imageUrl}')`;
                fixedBg.style.opacity = '1';
                fixedOverlay.style.opacity = '1';
            };
        }

        function showChampionPage(champId) {
            currentChampId = champId;

            const champ = champions.find(c => c.id === champId);
            if (!champ) return showChampionsList();

            document.getElementById("addChampIconBtn").style.display = "none";

            const main = document.getElementById("mainContainer");
            const tags = (champ.tags || "MID, MAGE").split(",").map(t => `<span class="tag-badge">${t.trim()}</span>`).join("");
            const skins = champ.skins || [{ name: champ.name, thumb: champ.imgUrl, frameImg: champ.imgUrl, splash: champ.splashUrl, posX: 50, posY: 50 }];

            const currentSkin = skins[selectedSkinIndex] || skins[0];
            const activeFrameImg = currentSkin.frameImg || currentSkin.thumb || champ.imgUrl || '';
            const activeSplashImg = currentSkin.splash || champ.splashUrl || champ.imgUrl || '';
            const activeSkinName = currentSkin.name || champ.name;

            updateBackgroundSplash(activeSplashImg);

            let skinsHtml = '';
            skins.forEach((s, index) => {
                const activeClass = index === selectedSkinIndex ? 'active' : '';
                const posX = s.posX ?? 50;
                const posY = s.posY ?? 50;
                skinsHtml += `
                    <div class="skin-item ${activeClass}" id="skinItem_${index}" onclick="selectSkin(${index})">
                        <div class="skin-thumb" style="background-image: url('${s.thumb || champ.imgUrl}'); background-position: ${posX}% ${posY}%;"></div>
                        <div class="skin-name">${s.name}</div>
                    </div>`;
            });

        function renderContentArea() {
            currentAudioList = [];
            currentAudioIndex = -1;

            const items = pageElements
                .filter(e => e.champId === currentChampId && (e.skinIndex === undefined || e.skinIndex === null || e.skinIndex === selectedSkinIndex))
                .sort((a, b) => {
                    const orderA = a.orderIndex !== undefined ? a.orderIndex : (a.id || 0);
                    const orderB = b.orderIndex !== undefined ? b.orderIndex : (b.id || 0);
                    return orderA - orderB;
                });

            let html = '';
            const orphanQuotes = items.filter(i => i.type === 'quote' && !i.categoryId);
            if (orphanQuotes.length > 0) {
                orphanQuotes.forEach(quote => { html += renderQuoteRow(quote); });
            }

            const renderedCatIds = new Set();

            function renderCategoryTree(parentId = null) {
                const subCats = items.filter(i => i.type === 'title' && (parentId === null ? !i.parentId : i.parentId == parentId));

                subCats.forEach(cat => {
                    if (renderedCatIds.has(cat.id)) return;
                    renderedCatIds.add(cat.id);

                    const titleActions = `
                        <div class="item-actions edit-only-inline">
                            <span class="action-btn-add" title="Adicionar Subcategoria" onclick="openTitleModal(null, ${cat.id})">+ Subcat</span>
                            <span class="action-btn-add" title="Adicionar Fala" onclick="openQuoteModal(null, ${cat.id})">+ Fala</span>
                            <span class="action-icon" title="Editar" onclick="openTitleModal(${cat.id})">✏️</span>
                        </div>`;

                    html += `<div class="dynamic-header-container">
                        <div class="dynamic-header-content"><${cat.level}>${cat.text}</${cat.level}></div>
                        ${titleActions}
                    </div>`;

                    const catQuotes = items.filter(i => i.type === 'quote' && i.categoryId == cat.id);
                    catQuotes.forEach(quote => { html += renderQuoteRow(quote); });

                    renderCategoryTree(cat.id);
                });
            }

            renderCategoryTree(null);

            const container = document.getElementById("contentArea");
            if (container) container.innerHTML = html;
        }

        async function processTextImport() {
            const text = document.getElementById("rawTextInput").value;
            if (!text.trim()) return alert("Cole o texto das falas primeiro!");

            const lines = text.split("\n");
            let currentMainCatId = null;
            let currentSubCatId = null;
            let orderCount = Date.now();

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                if (line.startsWith("“") || line.startsWith('"') || line.startsWith("•") || line.startsWith("-")) {
                    let cleanQuote = line.replace(/^[“"•-]\s*/, '').replace(/[”"]$/, '').trim();
                    if (cleanQuote) {
                        let catToUse = currentSubCatId || currentMainCatId;
                        await addRecordAsync("elements", {
                            champId: currentChampId,
                            skinIndex: selectedSkinIndex,
                            type: 'quote',
                            text: `“${cleanQuote}”`,
                            audios: [],
                            categoryId: catToUse,
                            position: 'end',
                            orderIndex: orderCount++
                        });
                    }
                } else {
                    if (line.includes("—") || line.includes("-")) {
                        currentSubCatId = await addRecordAsync("elements", {
                            champId: currentChampId,
                            skinIndex: selectedSkinIndex,
                            type: 'title',
                            level: 'h3',
                            text: line,
                            parentId: currentMainCatId,
                            position: 'end',
                            orderIndex: orderCount++
                        });
                    } else {
                        currentMainCatId = await addRecordAsync("elements", {
                            champId: currentChampId,
                            skinIndex: selectedSkinIndex,
                            type: 'title',
                            level: 'h2',
                            text: line,
                            parentId: null,
                            position: 'end',
                            orderIndex: orderCount++
                        });
                        currentSubCatId = null;
                    }
                }
            }

            alert("Falas e categorias importadas com sucesso!");
            closeModal("textImportModal");
            loadData(() => { renderContentArea(); });
        }

        function addRecordAsync(storeName, record) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([storeName], "readwrite");
                const store = tx.objectStore(storeName);
                const req = store.add(record);
                req.onsuccess = (ev) => resolve(ev.target.result);
                req.onerror = (ev) => reject(ev.target.error);
            });
        }

        function clearStoreAsync(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([storeName], "readwrite");
                const store = tx.objectStore(storeName);
                const req = store.clear();
                req.onsuccess = () => resolve();
                req.onerror = (ev) => reject(ev.target.error);
            });
        }

        async function importarBackupJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const dadosImportados = JSON.parse(e.target.result);

                    let newChampions = [];
                    let newElements = [];

                    if (Array.isArray(dadosImportados.champions)) {
                        newChampions = dadosImportados.champions;
                        newElements = dadosImportados.elements || [];
                    } else if (typeof dadosImportados === 'object') {
                        for (const key in dadosImportados) {
                            const item = dadosImportados[key];
                            const cName = item.nome || item.name || key.toUpperCase();
                            newChampions.push({
                                name: cName,
                                title: item.title || "",
                                tags: "MID",
                                bio: "",
                                imgUrl: "",
                                splashUrl: "",
                                skins: [{ name: cName, thumb: "", frameImg: "", splash: "", posX: 50, posY: 50 }]
                            });
                        }
                    }

                    if (newChampions.length === 0) {
                        alert("Nenhum dado válido encontrado no arquivo JSON.");
                        return;
                    }

                    await clearStoreAsync("champions");
                    await clearStoreAsync("elements");

                    const champIdMap = {};
                    const catIdMap = {};

                    for (const champ of newChampions) {
                        const oldId = champ.id;
                        delete champ.id;
                        const newId = await addRecordAsync("champions", champ);
                        if (oldId !== undefined) champIdMap[oldId] = newId;
                    }

                    const titles = newElements.filter(e => e.type === 'title');
                    const quotes = newElements.filter(e => e.type === 'quote');

                    for (const title of titles) {
                        const oldId = title.id;
                        delete title.id;
                        if (title.champId && champIdMap[title.champId]) {
                            title.champId = champIdMap[title.champId];
                        }
                        const newId = await addRecordAsync("elements", title);
                        if (oldId !== undefined) catIdMap[oldId] = newId;
                    }

                    for (const quote of quotes) {
                        delete quote.id;
                        if (quote.champId && champIdMap[quote.champId]) {
                            quote.champId = champIdMap[quote.champId];
                        }
                        if (quote.categoryId && catIdMap[quote.categoryId]) {
                            quote.categoryId = catIdMap[quote.categoryId];
                        }
                        await addRecordAsync("elements", quote);
                    }

                    alert("Backup importado com sucesso!");
                    currentChampId = null;
                    loadData();

                } catch (error) {
                    console.error("Erro na importação assíncrona:", error);
                    alert("Ocorreu um erro ao importar o arquivo JSON.");
                }
            };
            reader.readAsText(file);
        }

            });

        async function executeTransferQuotes() {
            const fromIdx = parseInt(document.getElementById("transferFromSkinSelect").value);
            const toIdx = parseInt(document.getElementById("transferToSkinSelect").value);
            const action = document.getElementById("transferActionType").value;

            if (fromIdx === toIdx) return alert("Selecione skins diferentes!");

            const sourceElements = pageElements.filter(e => e.champId === currentChampId && (e.skinIndex ?? 0) === fromIdx);
            if (sourceElements.length === 0) return alert("Nenhum elemento encontrado na skin de origem.");

            const catMap = {};

            if (action === 'move') {
                const tx = db.transaction(["elements"], "readwrite");
                const store = tx.objectStore("elements");
                sourceElements.forEach(item => {
                    item.skinIndex = toIdx;
                    store.put(item);
                });
                tx.oncomplete = () => {
                    closeModal("transferModal");
                    loadData(() => { renderContentArea(); });
                    alert("Elementos movidos com sucesso!");
                };
            } else if (action === 'copy') {
                const titles = sourceElements.filter(e => e.type === 'title');
                for (const cat of titles) {
                    const oldId = cat.id;
                    const newCat = JSON.parse(JSON.stringify(cat));
                    delete newCat.id;
                    newCat.skinIndex = toIdx;
                    if (newCat.parentId && catMap[newCat.parentId]) {
                        newCat.parentId = catMap[newCat.parentId];
                    }
                    const newId = await addRecordAsync("elements", newCat);
                    catMap[oldId] = newId;
                }

                const quotes = sourceElements.filter(e => e.type === 'quote');
                for (const quote of quotes) {
                    const newQuote = JSON.parse(JSON.stringify(quote));
                    delete newQuote.id;
                    newQuote.skinIndex = toIdx;
                    if (newQuote.categoryId && catMap[newQuote.categoryId]) {
                        newQuote.categoryId = catMap[newQuote.categoryId];
                    }
                    await addRecordAsync("elements", newQuote);
                }

                closeModal("transferModal");
                loadData(() => { renderContentArea(); });
                alert("Elementos copiados com sucesso!");
            }
        }

                skins.push({
                    name: card.querySelector(".skin-name-in").value.trim() || name,
                    thumb: card.querySelector(".skin-thumb-in").value.trim(),
                    frameImg: card.querySelector(".skin-frame-in").value.trim(),
                    splash: card.querySelector(".skin-splash-in").value.trim(),
                    posX: parseInt(card.querySelector(".skin-posx-in").value) || 50,
                    posY: parseInt(card.querySelector(".skin-posy-in").value) || 50
                });
            });

            if (skins.length === 0) skins.push({ name: name, thumb: "", frameImg: "", splash: "", posX: 50, posY: 50 });

            const record = {
                name, title, tags, bio,
                imgUrl: skins[0].frameImg || skins[0].thumb,
                splashUrl: skins[0].splash,
                skins
            };

            const tx = db.transaction(["champions"], "readwrite");
            const store = tx.objectStore("champions");

            if (id) {
                record.id = parseInt(id);
                store.put(record);
            } else {
                store.add(record);
            }

            tx.oncomplete = () => {
                closeModal("champModal");
                loadData();
            };
        }

        function deleteChampion() {
            const id = parseInt(document.getElementById("editChampId").value);
            if (!id) return;

            if (confirm("Deseja realmente excluir este campeão e todo o seu conteúdo?")) {
                const tx = db.transaction(["champions", "elements"], "readwrite");
                tx.objectStore("champions").delete(id);

                const elStore = tx.objectStore("elements");
                const index = elStore.index("champId");
                index.openCursor(IDBKeyRange.only(id)).onsuccess = function(e) {
                    const cursor = e.target.result;
                    if (cursor) {
                        cursor.delete();
                        cursor.continue();
                    }
                };

                tx.oncomplete = () => {
                    closeModal("champModal");
                    showChampionsList();
                    loadData();
                };
            }
        }

        function openTitleModal(id = null, parentCatId = null) {
            const parentSelect = document.getElementById("parentCategorySelect");
            parentSelect.innerHTML = '<option value="">Nenhuma (Categoria Principal)</option>';

            const categories = pageElements.filter(e => e.champId === currentChampId && e.type === 'title' && (e.skinIndex ?? 0) === selectedSkinIndex);
            categories.forEach(cat => {
                if (!id || cat.id !== id) {
                    const cleanName = cat.text.replace(/<[^>]*>?/gm, '');
                    parentSelect.innerHTML += `<option value="${cat.id}">${cleanName}</option>`;
                }
            });

            if (id) {
                const titleBlock = pageElements.find(e => e.id === id);
                document.getElementById("editTitleId").value = titleBlock.id;
                document.getElementById("titleEditor").innerHTML = titleBlock.text;
                document.getElementById("titleLevelSelect").value = titleBlock.level || 'h2';
                document.getElementById("titlePositionSelect").value = titleBlock.position || 'end';
                parentSelect.value = titleBlock.parentId || '';
                document.getElementById("deleteTitleBtn").style.display = "block";
            } else {
                document.getElementById("editTitleId").value = "";
                document.getElementById("titleEditor").innerHTML = "";
                document.getElementById("titleLevelSelect").value = parentCatId ? 'h3' : 'h2';
                document.getElementById("titlePositionSelect").value = 'end';
                parentSelect.value = parentCatId || '';
                document.getElementById("deleteTitleBtn").style.display = "none";
            }
            document.getElementById("titleModal").style.display = "flex";
        }

        function saveTitleBlock() {
            const id = document.getElementById("editTitleId").value;
            const text = document.getElementById("titleEditor").innerHTML.trim();
            if (!text) return alert("Digite o texto da categoria!");

            const level = document.getElementById("titleLevelSelect").value;
            const position = document.getElementById("titlePositionSelect").value;
            const parentVal = document.getElementById("parentCategorySelect").value;
            const parentId = parentVal ? parseInt(parentVal) : null;

            let existingRecord = null;
            if (id) {
                existingRecord = pageElements.find(e => e.id === parseInt(id));
            }

            let computedOrderIndex;
            if (existingRecord && existingRecord.orderIndex !== undefined) {
                computedOrderIndex = existingRecord.orderIndex;
            } else {
                computedOrderIndex = position === 'start' ? Date.now() * -1 : Date.now();
            }

            const record = {
                champId: currentChampId,
                skinIndex: selectedSkinIndex,
                type: 'title',
                level, text, parentId, position,
                orderIndex: computedOrderIndex
            };

            const tx = db.transaction(["elements"], "readwrite");
            const store = tx.objectStore("elements");

            if (id) {
                record.id = parseInt(id);
                store.put(record);
            } else {
                store.add(record);
            }

            tx.oncomplete = () => {
                closeModal("titleModal");
                loadData(() => { renderContentArea(); });
            };
        }

        function deleteTitleBlock() {
            const id = parseInt(document.getElementById("editTitleId").value);
            if (!id) return;

            if (confirm("Excluir esta categoria?")) {
                const tx = db.transaction(["elements"], "readwrite");
                tx.objectStore("elements").delete(id);
                tx.oncomplete = () => {
                    closeModal("titleModal");
                    loadData(() => { renderContentArea(); });
                };
            }
        }

        function openQuoteModal(id = null, categoryId = null) {
            const catSelect = document.getElementById("quoteCategorySelect");
            catSelect.innerHTML = '<option value="">Sem Categoria</option>';

            const categories = pageElements.filter(e => e.champId === currentChampId && e.type === 'title' && (e.skinIndex ?? 0) === selectedSkinIndex);
            categories.forEach(cat => {
                const cleanName = cat.text.replace(/<[^>]*>?/gm, '');
                catSelect.innerHTML += `<option value="${cat.id}">${cleanName}</option>`;
            });

            document.getElementById("audioInputsContainer").innerHTML = "";

            if (id) {
                const quote = pageElements.find(e => e.id === id);
                document.getElementById("editQuoteId").value = quote.id;
                document.getElementById("quoteTextEditor").innerHTML = quote.text;
                catSelect.value = quote.categoryId || '';
                document.getElementById("quotePositionSelect").value = quote.position || 'end';
                document.getElementById("deleteQuoteBtn").style.display = "block";

                if (quote.audios && quote.audios.length > 0) {
                    quote.audios.forEach(aud => addAudioInputRow(aud));
                } else {
                    addAudioInputRow();
                }
            } else {
                document.getElementById("editQuoteId").value = "";
                document.getElementById("quoteTextEditor").innerHTML = "";
                catSelect.value = categoryId || '';
                document.getElementById("quotePositionSelect").value = 'end';
                document.getElementById("deleteQuoteBtn").style.display = "none";
                addAudioInputRow();
            }

            document.getElementById("quoteModal").style.display = "flex";
        }

        function addAudioInputRow(val = '') {
            const container = document.getElementById("audioInputsContainer");
            const div = document.createElement("div");
            div.className = "audio-input-row";
            div.innerHTML = `
                <input type="text" value="${val}" placeholder="URL do áudio (.ogg, .mp3)">
                <button type="button" class="remove-audio-btn" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(div);
        }

        function saveQuote() {
            const id = document.getElementById("editQuoteId").value;
            const text = document.getElementById("quoteTextEditor").innerHTML.trim();
            if (!text) return alert("Digite o texto da fala!");

            const catVal = document.getElementById("quoteCategorySelect").value;
            const categoryId = catVal ? parseInt(catVal) : null;
            const position = document.getElementById("quotePositionSelect").value;

            const audioInputs = document.querySelectorAll("#audioInputsContainer input");
            const audios = [];
            audioInputs.forEach(input => {
                if (input.value.trim()) audios.push(input.value.trim());
            });

            let existingRecord = null;
            if (id) {
                existingRecord = pageElements.find(e => e.id === parseInt(id));
            }

            let computedOrderIndex;
            if (existingRecord && existingRecord.orderIndex !== undefined) {
                computedOrderIndex = existingRecord.orderIndex;
            } else {
                computedOrderIndex = position === 'start' ? Date.now() * -1 : Date.now();
            }

            const record = {
                champId: currentChampId,
                skinIndex: selectedSkinIndex,
                type: 'quote',
                text, audios, categoryId, position,
                orderIndex: computedOrderIndex
            };

            const tx = db.transaction(["elements"], "readwrite");
            const store = tx.objectStore("elements");

            if (id) {
                record.id = parseInt(id);
                store.put(record);
            } else {
                store.add(record);
            }

            tx.oncomplete = () => {
                closeModal("quoteModal");
                loadData(() => { renderContentArea(); });
            };
        }

        function deleteQuote() {
            const id = parseInt(document.getElementById("editQuoteId").value);
            if (!id) return;

            if (confirm("Excluir esta fala?")) {
                const tx = db.transaction(["elements"], "readwrite");
                tx.objectStore("elements").delete(id);
                tx.oncomplete = () => {
                    closeModal("quoteModal");
                    loadData(() => { renderContentArea(); });
                };
            }
        }
    </script>
</body>
</html>
